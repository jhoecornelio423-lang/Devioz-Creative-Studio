<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devioz Creative Studio - Flyer con Captura Real</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #020707;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 50px;
      padding: 40px;
      font-family: 'Inter', sans-serif;
    }

    /* Contenedor del Flyer (896 x 1200 px - Proporción 3:4) */
    .flyer-wrapper {
      width: 896px;
      height: 1200px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.95);
      border-radius: 4px;
    }

    .flyer-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Tarjeta flotante con captura real del sistema */
    .inset-ui-card {
      position: absolute;
      bottom: 45px;
      left: 45px;
      width: 380px;
      background: rgba(4, 18, 18, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 194, 194, 0.5);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.85), 0 0 25px rgba(0, 194, 194, 0.22);
      transition: transform 0.3s ease;
      z-index: 10;
    }

    /* Variante en esquina inferior derecha */
    .inset-ui-card.bottom-right {
      left: auto;
      right: 45px;
    }

    .inset-header {
      background: #081a1a;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 194, 194, 0.25);
    }

    .window-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }
    .dot-red { background: #ef4444; }
    .dot-yellow { background: #f59e0b; }
    .dot-green { background: #10b981; }

    .window-title {
      font-size: 11px;
      font-weight: 600;
      color: #2dd4bf;
      letter-spacing: 0.5px;
      font-family: monospace;
    }

    .inset-body {
      padding: 6px;
      background: #020b0b;
    }

    .inset-body img {
      width: 100%;
      height: 195px;
      object-fit: cover;
      object-position: top left;
      border-radius: 6px;
      display: block;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .inset-footer {
      padding: 8px 14px;
      background: #081a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 500;
      border-top: 1px solid rgba(0, 194, 194, 0.15);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #34d399;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .pulse-circle {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body>

  <!-- VERSIÓN 1: POSTPRODUCCIÓN CON CAPTURA DEL DASHBOARD -->
  <div class="flyer-wrapper" id="flyerPostproduccion">
    <img src="assets/img/flyer-devioz-postproduccion.jpg" alt="Devioz Postproducción" class="flyer-bg">
    
    <!-- Captura real en pequeña sección flotante -->
    <div class="inset-ui-card">
      <div class="inset-header">
        <div class="window-dots">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
        <span class="window-title">admin.devioz.com/dashboard</span>
      </div>
      <div class="inset-body">
        <img src="assets/img/screenshot_admin_dashboard.png" alt="Dashboard Real del Sistema">
      </div>
      <div class="inset-footer">
        <span>Panel Administrativo en Vivo</span>
        <span class="status-badge"><span class="pulse-circle"></span> Conectado</span>
      </div>
    </div>
  </div>

  <!-- VERSIÓN 2: RODAJE CON CAPTURA DE LA WEB PÚBLICA -->
  <div class="flyer-wrapper" id="flyerRodaje">
    <img src="assets/img/flyer-devioz-rodaje.jpg" alt="Devioz Rodaje" class="flyer-bg">
    
    <!-- Captura real en pequeña sección flotante (esquina inferior derecha) -->
    <div class="inset-ui-card bottom-right">
      <div class="inset-header">
        <div class="window-dots">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
        <span class="window-title">devioz.com/portafolio</span>
      </div>
      <div class="inset-body">
        <img src="assets/img/screenshot_web.png" alt="Web Pública Real">
      </div>
      <div class="inset-footer">
        <span>Portal Web &amp; Portafolio de Clientes</span>
        <span class="status-badge"><span class="pulse-circle"></span> Online</span>
      </div>
    </div>
  </div>

</body>
</html>
