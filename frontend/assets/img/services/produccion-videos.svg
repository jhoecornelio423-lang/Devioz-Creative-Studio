<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5e5"/>
      <stop offset="100%" stop-color="#00a3a3"/>
    </linearGradient>
  </defs>
  <!-- Subtle circular base -->
  <circle cx="24" cy="24" r="22" fill="#00c2c2" fill-opacity="0.12"/>
  <!-- Film tape spools on top -->
  <circle cx="14" cy="11" r="3.5" stroke="#00e5e5" stroke-width="2" fill="#002b2b"/>
  <circle cx="22" cy="11" r="3.5" stroke="#00e5e5" stroke-width="2" fill="#002b2b"/>
  <!-- Video camera body -->
  <rect x="7" y="14" width="22" height="20" rx="4" stroke="url(#grad2)" stroke-width="2.5" fill="#003333" fill-opacity="0.4"/>
  <!-- Camera Lens Cone -->
  <path d="M29 20 L40 13 L40 35 L29 28 Z" fill="url(#grad2)"/>
