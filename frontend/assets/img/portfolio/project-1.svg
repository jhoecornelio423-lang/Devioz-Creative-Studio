<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a1a"/>
      <stop offset="50%" stop-color="#002b2b"/>
      <stop offset="100%" stop-color="#004d4d"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c2c2"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Decorative Circles -->
  <circle cx="700" cy="100" r="180" fill="#00c2c2" opacity="0.08" filter="url(#glow)"/>
  <circle cx="100" cy="400" r="150" fill="#14b8a6" opacity="0.1" filter="url(#glow)"/>
  
  <!-- Geometric Grid Lines -->
  <path d="M 0 100 L 800 100 M 0 200 L 800 200 M 0 300 L 800 300 M 0 400 L 800 400" stroke="rgba(0,194,194,0.06)" stroke-width="1"/>
  <path d="M 160 0 L 160 500 M 320 0 L 320 500 M 480 0 L 480 500 M 640 0 L 640 500" stroke="rgba(0,194,194,0.06)" stroke-width="1"/>

  <!-- Center Card Visual -->
  <rect x="220" y="120" width="360" height="260" rx="16" fill="rgba(0, 26, 26, 0.7)" stroke="#00c2c2" stroke-width="2" opacity="0.9"/>
  
  <!-- Center Icon Graphic -->
  <g transform="translate(400, 220)" text-anchor="middle">
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#cyan-glow)" stroke-width="4"/><polygon points="-12,-15 18,0 -12,15" fill="#00c2c2"/>
  </g>

  <!-- Labels -->
  <text x="400" y="320" font-family="Outfit, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Campaña Redes Sociales</text>
  <text x="400" y="345" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#00c2c2" text-anchor="middle" letter-spacing="2">DISENO-GRAFICO</text>
</svg>